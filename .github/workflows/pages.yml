# =============================================================================
#  Check every change, and rebuild the preview
# =============================================================================
#  This is the green tick or the red X a secretary sees beside their commit,
#  and it is the thing tools/server-deploy.sh refuses to publish past. It does
#  two jobs in one: it CHECKS the change (the officer data adds up, next year's
#  roster edits still render, every page comes out of PHP without an error in
#  it), and then it REBUILDS the preview at caltech-alpine.github.io so the
#  change can be looked at before it goes anywhere near the club's server.
#
#  GitHub Pages does not execute PHP, and this site is server-rendered PHP. So
#  the workflow runs the site against PHP's own dev server, saves every page as
#  HTML, and publishes that. tools/build_static.py does the rendering and
#  explains what changes in the output.
#
#  WHY THE SCHEDULE. The only live data on the site is the club's Google
#  Calendar, which the PHP layer caches for five minutes. This rebuild stays at
#  thirty on purpose: GitHub's scheduler will not reliably do better (see the
#  first caveat), and the pilot is a preview of the design, not the club's
#  calendar of record. Two caveats worth knowing:
#    * GitHub runs scheduled workflows late when the fleet is busy. Minutes,
#      occasionally longer. Nothing here is time-critical enough to care.
#    * GitHub DISABLES scheduled workflows in a repository with no activity for
#      60 days, and only emails the last person who touched it. If events stop
#      updating months from now, look here first.
#
#  This publishes a PILOT: --noindex keeps it out of search results so it
#  cannot compete with the club's real site. Remove that flag if Pages ever
#  becomes the production home. See docs/HOSTING.md.
# =============================================================================

name: Check and preview

on:
  push:
    branches: [main]
  # A change proposed as a pull request gets the same checks. Without this it
  # would get NONE of them: the reviewer would see a clean-looking diff, the
  # checks would first run after the merge, and the person who has to read the
  # failure is then the one who did not write it.
  pull_request:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"      # keep the calendar current
  workflow_dispatch:             # a "rebuild now" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue instead of cancelling, so a scheduled
# rebuild cannot discard a push that is mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show the PHP we are building with
        run: php -v

      # The officer data, before anything else. A mistyped role_id or person_id
      # produces a site that renders perfectly and says something false -- an
      # officer missing from the roster, or a job advertised as open that
      # somebody is doing. There is no visible symptom, so it has to be caught
      # here. build_static.py runs this too; a separate step means the Actions
      # log says plainly which check failed.
      - name: Check the officer data adds up
        run: php tools/check.php --data

      # And then the edits a new officer will actually make: replacing
      # somebody, adding a co-officer, renaming a title, changing a maximum,
      # deleting a role. Each is applied to the real CSVs, rendered through real
      # PHP, and checked -- including whether the OLD name and address survive
      # anywhere on the site. The files are restored afterwards.
      - name: Try next year's officer changes
        run: python3 tools/test_roles.py

      # The documentation is the product here -- SECRETARY.md is followed
      # literally by somebody who was promised they would never have to search
      # this repository. A link into thin air breaks that promise, and renaming
      # a file is how it happens.
      - name: Check the documentation points at things that exist
        run: python3 tools/check_docs.py

      # Only on a real publish. On a pull request there is nothing to publish
      # to, and this action asks GitHub's Pages API for the site's address --
      # which a pull request from a fork is not allowed to do, and the failure
      # would read as "your change broke the build" when it did no such thing.
      # The render below falls back to the known address.
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Prepare officer headshots
        # Officers drop an ORIGINAL into assets/images/officers/raw/ and
        # this makes the 528x660 the roster serves. A photo already at 4:5
        # is only resized, because the crop is a human's judgement and not
        # something an aspect ratio can work out.
        run: |
          python3 -m pip install --quiet --disable-pip-version-check Pillow
          python3 tools/prepare_officers.py

      - name: Render the site
        run: |
          BASE="${{ steps.pages.outputs.base_url }}"
          python3 tools/build_static.py \
            --base-url "${BASE:-https://caltech-alpine.github.io}" \
            --noindex

      # Cheap insurance: the build is only as good as the pages it produced, and
      # a PHP fatal error still returns a 200-byte page rather than failing.
      - name: Sanity-check the output
        run: |
          set -e
          for f in index events join roles gear about support 404; do
            test -s "_site/$f.html" || { echo "missing _site/$f.html"; exit 1; }
            if grep -qiE "Fatal error|Parse error|Warning:</b>" "_site/$f.html"; then
              echo "PHP error inside _site/$f.html"; exit 1
            fi
            if [ "$(wc -c < "_site/$f.html")" -lt 4000 ]; then
              echo "_site/$f.html is suspiciously small"; exit 1
            fi
          done
          test -s _site/assets/css/style.css
          test -f _site/.nojekyll
          echo "built $(find _site -type f | wc -l) files"

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    # A pull request is checked, not published. The preview at
    # caltech-alpine.github.io always shows what is on main, so that a link
    # given to somebody means one thing rather than whichever branch built last.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
