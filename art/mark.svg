<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  THE MARK, AS DRAWN. Kyle, 2026-09-30, in Inkscape. The source of record for
  every mark, favicon and lockup the site serves.

  READ AS VECTOR, NOT TRACED (tools/trace_logo.py, load_vector()). The C is two
  concentric circles and the mountain's base is the C's outer circle, so a
  trace could only add error. Only VISIBLE paths are read: the hidden
  "scratch" layer is ignored. Each path joins the layer nearest its fill,
  orange to the alpenglow C and black or unfilled to the ink mountain. The
  output colours come from assets/css/style.css, not from this file.

  HOW TO CHANGE IT: open in Inkscape, edit, save, then run
  python tools/trace_logo.py, tools/make_icons.py and tools/make_social.py.
  Supersedes art/favicon.png, which is kept as the earlier drawing.
-->

