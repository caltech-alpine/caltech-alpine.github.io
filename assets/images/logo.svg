<!--
  THE CALTECH ALPINE CLUB MARK: two crossed ice axes under a flame.

  Traced from the artwork at 1254px with potrace (saturation threshold, a 2px
  gaussian, alphamax 1.0, opttolerance 0.6). The result disagrees with the
  source raster on 1.80% of the mark's pixels and by 1.0/255 when both are
  rendered at 32px, which is the size that decides whether a favicon reads.

  ONE PATH, two subpaths: the crossed axes merge into a single silhouette, and
  the flame is separate. The flame's inner tongue is a notch that opens
  downward, not an enclosed hole, so no fill rule is needed.

  THE COLOUR IS #be512d, which is the alpenglow token in
  assets/css/style.css. That token is the one the palette names for "fills,
  buttons, icons, large text, decoration", and a mark is decoration. It is 3.75
  to 1 on the ink masthead and footer and 4.42 to 1 on paper, so a single file
  covers both and there is no second orange anywhere on the site.

  There was briefly an accent-on-dark version of this file. That token is the
  SMALL TEXT lift for dark sections and using it here put the mark a visible
  step lighter than the accent beside it.

  THE COLOUR IS HARDCODED, not currentColor. This file is loaded with <img>,
  and an SVG used as an image has no parent to inherit from; currentColor there
  resolves to black. If you change the alpenglow token, change this to match.

  Do NOT put a doubled hyphen anywhere in this comment. It is illegal inside an
  XML comment, and a browser parses an SVG loaded through <img> strictly: one
  of them makes the whole mark fail to render. Check with:
    python -c "import xml.etree.ElementTree as E;E.parse('logo.svg')"
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Caltech Alpine Club" fill="#be512d">
